<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乒乓球 Pong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .game-container { text-align: center; }
        canvas { border: 2px solid #ec4899; background: #0f0c29; border-radius: 8px; }
        .info { margin-top: 20px; color: #fff; display: flex; justify-content: center; gap: 40px; }
        .info p { font-size: 18px; }
        .info span { color: #f472b6; font-weight: bold; }
        .controls { margin-top: 15px; color: #94a3b8; font-size: 14px; }
        button { background: #ec4899; color: #fff; border: none; padding: 10px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #db2777; }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="info">
            <p>玩家: <span id="playerScore">0</span></p>
            <p>电脑: <span id="aiScore">0</span></p>
        </div>
        <div class="controls">↑ ↓ 控制球拍 | 按空格键暂停</div>
        <button onclick="startGame()">重新开始</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');

        const PADDLE_WIDTH = 10, PADDLE_HEIGHT = 80, BALL_SIZE = 10;
        let playerY = 160, aiY = 160, ballX = 300, ballY = 200;
        let ballSpeedX = 5, ballSpeedY = 3, playerSpeed = 0;
        let playerScore = 0, aiScore = 0, gameRunning = true, paused = false;

        function startGame() {
            playerY = 160; aiY = 160; ballX = 300; ballY = 200;
            ballSpeedX = 5; ballSpeedY = 3; playerSpeed = 0;
            playerScore = 0; aiScore = 0; gameRunning = true; paused = false;
            playerScoreEl.textContent = '0'; aiScoreEl.textContent = '0';
        }

        function update() {
            if (!gameRunning || paused) return;
            // 移动球
            ballX += ballSpeedX;
            ballY += ballSpeedY;
            // 上下碰撞
            if (ballY <= 0 || ballY >= 400) ballSpeedY = -ballSpeedY;
            // 玩家球拍碰撞
            if (ballX <= 20 && ballY >= playerY && ballY <= playerY + PADDLE_HEIGHT) {
                ballSpeedX = -ballSpeedX;
                ballX = 22;
            }
            // AI球拍碰撞
            if (ballX >= 580 && ballY >= aiY && ballY <= aiY + PADDLE_HEIGHT) {
                ballSpeedX = -ballSpeedX;
                ballX = 578;
            }
            // 得分
            if (ballX < 0) { aiScore++; aiScoreEl.textContent = aiScore; resetBall(); }
            if (ballX > 600) { playerScore++; playerScoreEl.textContent = playerScore; resetBall(); }
            // 玩家移动
            playerY += playerSpeed;
            if (playerY < 0) playerY = 0;
            if (playerY > 320) playerY = 320;
            // AI追踪球
            const aiCenter = aiY + PADDLE_HEIGHT/2;
            if (ballSpeedX > 0 && ballX > 300) {
                if (aiCenter < ballY - 10) aiY += 3;
                else if (aiCenter > ballY + 10) aiY -= 3;
            } else {
                if (aiCenter < 200) aiY += 1.5;
                else if (aiCenter > 200) aiY -= 1.5;
            }
            if (aiY < 0) aiY = 0;
            if (aiY > 320) aiY = 320;
        }

        function resetBall() {
            ballX = 300; ballY = 200;
            ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * 5;
            ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * 3;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 中线
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke();
            ctx.setLineDash([]);
            // 球拍
            ctx.fillStyle = '#f472b6';
            ctx.fillRect(10, playerY, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(580, aiY, PADDLE_WIDTH, PADDLE_HEIGHT);
            // 球
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_SIZE/2, 0, Math.PI * 2);
            ctx.fill();
            // 分数
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.font = '60px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(playerScore, 150, 80);
            ctx.fillText(aiScore, 450, 80);
            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.fillText('暂停', 300, 200);
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') playerSpeed = -6;
            if (e.key === 'ArrowDown') playerSpeed = 6;
            if (e.key === ' ') paused = !paused;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') playerSpeed = 0;
        });

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        startGame();
        gameLoop();
    </script>
</body>
</html>
