<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>井字棋 Tic-Tac-Toe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .game-container { text-align: center; }
        canvas { border: 2px solid #a855f7; background: #0f0c29; border-radius: 8px; cursor: pointer; }
        .info { margin-top: 20px; color: #fff; }
        .info p { font-size: 18px; }
        .info span { color: #c084fc; font-weight: bold; }
        .controls { margin-top: 15px; color: #94a3b8; font-size: 14px; }
        button { background: #a855f7; color: #fff; border: none; padding: 10px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #9333ea; }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="300" height="300"></canvas>
        <div class="info">
            <p>当前: <span id="turn">❌</span></p>
        </div>
        <div class="controls">点击格子下棋 | 先手 ❌</div>
        <button onclick="startGame()">重新开始</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const turnEl = document.getElementById('turn');

        const CELL = 100, SIZE = 3;
        let board = [], currentPlayer = 'X', gameOver = false, winner = null;

        function startGame() {
            board = Array.from({length: 3}, () => Array(3).fill(''));
            currentPlayer = 'X'; gameOver = false; winner = null;
            turnEl.textContent = '❌';
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 网格
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 3;
            for (let i = 1; i < 3; i++) {
                ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 300); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(300, i * CELL); ctx.stroke();
            }
            // 棋子
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const x = c * CELL + CELL/2, y = r * CELL + CELL/2;
                    if (board[r][c] === 'X') {
                        ctx.strokeStyle = '#ef4444';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(x - 25, y - 25); ctx.lineTo(x + 25, y + 25);
                        ctx.moveTo(x + 25, y - 25); ctx.lineTo(x - 25, y + 25);
                        ctx.stroke();
                    } else if (board[r][c] === 'O') {
                        ctx.strokeStyle = '#22d3ee';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(x, y, 30, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            }
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                if (winner === 'draw') ctx.fillText('🤝 平局！', 150, 150);
                else ctx.fillText('🎉 ' + winner + ' 赢了！', 150, 150);
            }
        }

        function checkWin() {
            const lines = [
                [[0,0],[0,1],[0,2]], [[1,0],[1,1],[1,2]], [[2,0],[2,1],[2,2]],
                [[0,0],[1,0],[2,0]], [[0,1],[1,1],[2,1]], [[0,2],[1,2],[2,2]],
                [[0,0],[1,1],[2,2]], [[0,2],[1,1],[2,0]]
            ];
            for (const line of lines) {
                const [a, b, c] = line;
                if (board[a[0]][a[1]] && board[a[0]][a[1]] === board[b[0]][b[1]] && board[a[0]][a[1]] === board[c[0]][c[1]]) {
                    winner = board[a[0]][a[1]];
                    return true;
                }
            }
            if (board.every(row => row.every(cell => cell !== ''))) { winner = 'draw'; return true; }
            return false;
        }

        canvas.addEventListener('click', e => {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((e.clientX - rect.left) / CELL);
            const r = Math.floor((e.clientY - rect.top) / CELL);
            if (r >= 0 && r < 3 && c >= 0 && c < 3 && board[r][c] === '') {
                board[r][c] = currentPlayer;
                if (checkWin()) {
                    gameOver = true;
                    if (winner === 'draw') turnEl.textContent = '🤝 平局';
                    else turnEl.textContent = '🎉 ' + winner + ' 赢了！';
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    turnEl.textContent = currentPlayer === 'X' ? '❌' : '⭕';
                }
                draw();
            }
        });

        startGame();
    </script>
</body>
</html>
