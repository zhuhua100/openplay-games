<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷 Minesweeper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .game-container { text-align: center; }
        canvas { border: 2px solid #f59e0b; background: #0f0c29; border-radius: 8px; cursor: pointer; }
        .info { margin-top: 20px; color: #fff; display: flex; justify-content: center; gap: 30px; }
        .info p { font-size: 18px; }
        .info span { color: #fbbf24; font-weight: bold; }
        .controls { margin-top: 15px; color: #94a3b8; font-size: 14px; }
        button { background: #f59e0b; color: #000; border: none; padding: 10px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background: #d97706; }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="360" height="360"></canvas>
        <div class="info">
            <p>💣 剩余: <span id="mines">10</span></p>
            <p>⏱️ <span id="timer">0</span></p>
        </div>
        <div class="controls">左键揭开 | 右键标记地雷</div>
        <button onclick="startGame()">重新开始</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minesSpan = document.getElementById('mines');
        const timerSpan = document.getElementById('timer');

        const ROWS = 9, COLS = 9, CELL_SIZE = 40, TOTAL_MINES = 10;
        let board = [], revealed = [], flagged = [], gameOver = false, gameWon = false;
        let minesCount = TOTAL_MINES, timer = 0, timerInterval;

        function startGame() {
            board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            revealed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            flagged = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            gameOver = false; gameWon = false;
            minesCount = TOTAL_MINES; timer = 0;
            minesSpan.textContent = minesCount;
            timerSpan.textContent = '0';
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => { if (!gameOver && !gameWon) { timer++; timerSpan.textContent = timer; } }, 1000);
            placeMines();
            draw();
        }

        function placeMines() {
            let placed = 0;
            while (placed < TOTAL_MINES) {
                const r = Math.floor(Math.random() * ROWS);
                const c = Math.floor(Math.random() * COLS);
                if (board[r][c] !== -1) {
                    board[r][c] = -1;
                    placed++;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] !== -1) board[nr][nc]++;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = c * CELL_SIZE, y = r * CELL_SIZE;
                    ctx.fillStyle = revealed[r][c] ? '#1e293b' : '#334155';
                    ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                    ctx.strokeStyle = '#475569';
                    ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
                    if (revealed[r][c]) {
                        if (board[r][c] === -1) {
                            ctx.fillStyle = '#ef4444';
                            ctx.font = '20px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('💣', x + CELL_SIZE/2, y + CELL_SIZE/2);
                        } else if (board[r][c] > 0) {
                            const colors = ['', '#3b82f6', '#22c55e', '#ef4444', '#a855f7', '#f59e0b', '#06b6d4', '#000', '#64748b'];
                            ctx.fillStyle = colors[board[r][c]] || '#fff';
                            ctx.font = 'bold 18px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(board[r][c], x + CELL_SIZE/2, y + CELL_SIZE/2);
                        }
                    } else if (flagged[r][c]) {
                        ctx.font = '20px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🚩', x + CELL_SIZE/2, y + CELL_SIZE/2);
                    }
                }
            }
            if (gameOver || gameWon) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(gameWon ? '🎉 你赢了！' : '💥 游戏结束', 180, 180);
            }
        }

        function reveal(r, c) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS || revealed[r][c] || flagged[r][c]) return;
            revealed[r][c] = true;
            if (board[r][c] === -1) { gameOver = true; clearInterval(timerInterval); draw(); return; }
            if (board[r][c] === 0) {
                for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) reveal(r + dr, c + dc);
            }
            checkWin();
            draw();
        }

        function checkWin() {
            let count = 0;
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (revealed[r][c]) count++;
            if (count === ROWS * COLS - TOTAL_MINES) { gameWon = true; clearInterval(timerInterval); draw(); }
        }

        canvas.addEventListener('contextmenu', e => e.preventDefault());
        canvas.addEventListener('mousedown', e => {
            if (gameOver || gameWon) return;
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const r = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
            if (e.button === 2) {
                if (!revealed[r][c]) {
                    flagged[r][c] = !flagged[r][c];
                    minesCount += flagged[r][c] ? -1 : 1;
                    minesSpan.textContent = minesCount;
                    draw();
                }
            } else if (e.button === 0) {
                reveal(r, c);
            }
        });

        startGame();
    </script>
</body>
</html>
